---
postgresql_version: "18"

postgresql_bin_path: "/usr/pgsql-{{ postgresql_version }}/bin"

postgresql_packages:
  - postgresql18
  - postgresql18-server
  - postgresql18-contrib

pgdg_gpg_key_generic: "/etc/pki/rpm-gpg/PGDG-RPM-GPG-KEY-RHEL"

pgdg_gpg_key_aarch64_url: >-
  https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-AARCH64-RHEL

pgdg_gpg_key_aarch64_path: "/etc/pki/rpm-gpg/PGDG-RPM-GPG-KEY-AARCH64-RHEL"
